<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Map Roulette</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0a0c10;
    --bg-2: #0e1117;
    --panel: #14171d;
    --panel-2: #181c24;
    --line: #1f2530;
    --line-2: #2a3142;
    --ink: #e6e8eb;
    --ink-2: #aab0bb;
    --muted: #6b7079;
    --dim: #4a4f59;
    --signal: #ff2d55;
    --signal-2: #ff5c7a;
    --signal-glow: rgba(255, 45, 85, 0.35);
    --amber: #ffb547;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    overflow: hidden;
    /* faint scanline texture */
    background-image:
      radial-gradient(ellipse at 70% 30%, rgba(40, 60, 90, 0.18), transparent 60%),
      radial-gradient(ellipse at 20% 90%, rgba(255, 45, 85, 0.05), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
  }

  #root { height: 100vh; }

  /* ---------- app shell ---------- */
  .app {
    height: 100vh;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
  }

  .hud-corners { position: absolute; inset: 14px; pointer-events: none; }
  .hud-corners .c {
    position: absolute; width: 14px; height: 14px;
    border: 1px solid var(--line-2);
  }
  .hud-corners .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .hud-corners .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .hud-corners .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .hud-corners .br { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  /* ---------- topbar ---------- */
  .topbar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
  }

  .spin-btn {
    appearance: none;
    background: var(--signal);
    color: #fff;
    border: 1px solid var(--signal-2);
    border-radius: 2px;
    padding: 14px 22px 14px 18px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--sans);
    font-weight: 800;
    letter-spacing: 0.14em;
    font-size: 18px;
    cursor: pointer;
    box-shadow:
      0 0 0 1px rgba(255, 45, 85, 0.25),
      0 8px 24px -8px var(--signal-glow),
      inset 0 1px 0 rgba(255,255,255,0.18);
    transition: transform 80ms ease, filter 120ms ease;
    position: relative;
  }
  .spin-btn:hover { filter: brightness(1.06); }
  .spin-btn:active { transform: translateY(1px); }
  .spin-btn:disabled { cursor: not-allowed; }
  .spin-btn .spin-glyph {
    width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px; line-height: 1;
    border: 1.5px solid rgba(255,255,255,0.55);
    border-radius: 50%;
    background: rgba(0,0,0,0.15);
  }
  .spin-btn.spinning .spin-glyph { animation: rot 0.7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .spin-btn .spin-hint {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 11px;
    opacity: 0.75;
    letter-spacing: 0.06em;
    margin-left: 6px;
    padding-left: 10px;
    border-left: 1px solid rgba(255,255,255,0.35);
  }

  .title-block { display: flex; flex-direction: column; gap: 2px; }
  .title-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.22em;
  }
  .title-main {
    font-weight: 800;
    font-size: 30px;
    letter-spacing: 0.16em;
    color: var(--ink);
  }

  .meta {
    display: flex;
    gap: 24px;
    font-family: var(--mono);
    font-size: 11px;
  }
  .meta-row { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  .meta-row .k { color: var(--muted); letter-spacing: 0.18em; }
  .meta-row .v { color: var(--ink); font-weight: 700; letter-spacing: 0.05em; }

  /* ---------- main grid ---------- */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(380px, 460px) 1fr;
    gap: 18px;
    min-height: 0;
  }

  .left {
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 18px;
    min-height: 0;
  }
  .right { min-height: 0; }

  /* ---------- panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    /* faint inner top hairline */
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    pointer-events: none;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .panel-tag {
    color: var(--ink);
    font-weight: 700;
  }
  .panel-tag::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--signal);
    margin-right: 8px;
    transform: translateY(-1px);
    box-shadow: 0 0 8px var(--signal);
  }
  .panel-sub { color: var(--muted); }
  .panel-head .coords { margin-left: auto; color: var(--ink-2); }
  .mono { font-family: var(--mono); }

  .panel-foot {
    border-top: 1px solid var(--line);
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.015));
  }

  /* ---------- reel ---------- */
  .reel-panel { min-height: 0; }
  .reel-window {
    position: relative;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }
  .reel-track {
    will-change: transform;
    transition: filter 180ms ease;
  }
  .reel-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 0 18px;
    border-bottom: 1px dashed rgba(42, 49, 66, 0.5);
    font-family: var(--mono);
    color: var(--ink-2);
    font-size: 15px;
    letter-spacing: 0.04em;
  }
  .reel-row .reel-code {
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
  }
  .reel-row .reel-name {
    color: var(--ink);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reel-row .reel-cont {
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .reel-row.active {
    background: linear-gradient(90deg, rgba(255,45,85,0.18), rgba(255,45,85,0.04));
  }
  .reel-row.active .reel-name { color: #fff; }
  .reel-row.active .reel-code { color: var(--signal-2); }

  /* center selector overlay */
  .reel-selector {
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 56px;
    transform: translateY(-50%);
    pointer-events: none;
    border-top: 1px solid var(--signal);
    border-bottom: 1px solid var(--signal);
    box-shadow:
      0 0 0 1px rgba(255, 45, 85, 0.15),
      0 0 36px -6px var(--signal-glow);
    z-index: 3;
  }
  .reel-selector::before, .reel-selector::after {
    content: "";
    position: absolute; left: 0; right: 0;
    height: 1px;
    background: var(--signal);
    opacity: 0.35;
  }
  .reel-selector::before { top: -3px; }
  .reel-selector::after { bottom: -3px; }
  .reel-selector-tag {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--signal);
    font-size: 16px;
    font-family: var(--mono);
    text-shadow: 0 0 12px var(--signal-glow);
  }
  .reel-selector-tag { left: 6px; }
  .reel-selector-tag.right { left: auto; right: 6px; }

  /* fade edges so reel feels like it disappears into chrome */
  .reel-edge {
    position: absolute; left: 0; right: 0; height: 90px;
    pointer-events: none; z-index: 2;
  }
  .reel-edge.top {
    top: 0;
    background: linear-gradient(180deg, var(--panel) 10%, rgba(20,23,29,0.85) 50%, transparent);
  }
  .reel-edge.bottom {
    bottom: 0;
    background: linear-gradient(0deg, var(--panel) 10%, rgba(20,23,29,0.85) 50%, transparent);
  }

  .ticker { display: inline-flex; align-items: center; gap: 8px; }
  .ticker-dot {
    width: 6px; height: 6px; background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    display: inline-block;
  }
  .ticker-text { color: var(--ink); font-weight: 700; }
  .ticker-right { color: var(--ink-2); }

  /* ---------- detail ---------- */
  .detail-panel { flex: 0 0 auto; }
  .detail {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .detail.empty {
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.18em;
    padding: 28px 18px;
    text-align: center;
  }

  .detail-header {
    display: grid;
    grid-template-columns: 78px 1fr auto;
    gap: 14px;
    align-items: center;
  }
  .flag-wrap {
    width: 78px; height: 52px;
    position: relative;
    background: #0a0c10;
    border: 1px solid var(--line-2);
  }
  .flag {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .flag-frame {
    position: absolute; inset: 0;
    border: 1px solid rgba(255,255,255,0.05);
    pointer-events: none;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
  }

  .detail-title { display: flex; flex-direction: column; gap: 2px; }
  .detail-code {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.18em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .detail-code .dot {
    width: 6px; height: 6px;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
  }
  .detail-name {
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1.1;
  }
  .detail-cont {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    letter-spacing: 0.22em;
  }

  .detail-status { text-align: right; }
  .status-pill {
    display: inline-block;
    padding: 4px 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    border: 1px solid var(--line-2);
    color: var(--ink-2);
  }
  .locked-pill {
    color: #fff;
    background: rgba(255, 45, 85, 0.15);
    border-color: var(--signal);
  }
  .scan-pill {
    color: var(--amber);
    border-color: rgba(255, 181, 71, 0.5);
    background: rgba(255, 181, 71, 0.07);
  }
  .status-sub {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.16em;
  }
  .status-sub.blink { animation: blink 0.9s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .stat {
    background: var(--panel-2);
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 4px;
    min-height: 64px;
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.2em;
  }
  .stat-value {
    font-weight: 700;
    color: var(--ink);
    font-size: 16px;
    letter-spacing: 0.02em;
  }
  .stat-value.mono { font-family: var(--mono); font-size: 14px; }
  .stat-sub {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  /* ---------- map ---------- */
  .map-panel { height: 100%; }
  .map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(30,40,55,0.4), transparent 70%),
      var(--bg-2);
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
  }
  .map-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .map-crosshair { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .scanline {
    position: absolute;
    left: 0; right: 0; top: 0; height: 2px;
    background: linear-gradient(180deg, transparent, rgba(255,45,85,0.55), transparent);
    box-shadow: 0 0 18px rgba(255,45,85,0.6);
    animation: scan 7s linear infinite;
    pointer-events: none;
  }
  @keyframes scan {
    0% { transform: translateY(0); opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }

  .legend {
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-2);
  }
  .legend .sw {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1px solid var(--line-2);
  }
  .legend .sw.active { background: var(--signal); border-color: var(--signal-2); }
  .legend .sw.inactive { background: #1a1e26; }
  .legend .sw + .sw { margin-left: 10px; }

  .history { display: inline-flex; align-items: center; gap: 8px; }
  .hist-label { color: var(--muted); letter-spacing: 0.2em; }
  .hist-empty { color: var(--dim); }
  .hist-chip {
    padding: 2px 6px;
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    background: rgba(255,255,255,0.02);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .hist-chip:first-of-type {
    color: #fff;
    border-color: var(--signal);
    background: rgba(255,45,85,0.15);
  }

  /* responsive: collapse to one column on small screens */
  @media (max-width: 1100px) {
    .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .left { grid-template-rows: 280px auto; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- d3 + topojson for the map -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <!-- data + app -->
  <script src="countries.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
