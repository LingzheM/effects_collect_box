<html lang="en">

<head>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #F5F5F0;
      color: #1A1A1A;
      overflow: hidden;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-template-rows: 2fr 1fr;
      height: 100dvh;
      width: 100vw;
    }

    .panel-left {
      grid-row: 1 / 3;
      border-right: 1px solid #D4D4D0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 0 24px;
      height: 48px;
      border-bottom: 1px solid #D4D4D0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1A1A1A;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-left .panel-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
      position: relative;
    }

    #radial-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
