  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #F5F5F0;
      color: #1A1A1A;
      overflow: hidden;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 2fr;
      grid-template-rows: 2fr 1fr;
      height: 100dvh;
      width: 100vw;
    }

    .panel-left {
      grid-row: 1 / 3;
      border-right: 1px solid #D4D4D0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 0 24px;
      height: 48px;
      border-bottom: 1px solid #D4D4D0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1A1A1A;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #spin-btn {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: #2563EB;
      border: none;
      padding: 6px 16px;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.15s;
    }

    #spin-btn:hover { opacity: 0.8; }
    #spin-btn:active { opacity: 0.6; }

    .panel-left .panel-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
      position: relative;
    }

    #radial-svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-select: none;
    }

    .panel-top-right {
      border-bottom: 1px solid #D4D4D0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-top-right .panel-body {
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      overflow: hidden;
      padding: 0;
      background: #D4D4D0;
      gap: 1px;
      position: relative;
    }

    #zoom-btn {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      background: #15803D;
      border: none;
      padding: 6px 16px;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.15s;
    }

    #zoom-btn:hover { opacity: 0.8; }
    #zoom-btn:active { opacity: 0.6; }

    .map-cell {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #FAFAF8;
      overflow: hidden;
      position: relative;
    }

    .map-cell-header {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      border-bottom: 1px solid #E8E8E4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-svg {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block;
    }

    #map-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      background: #001F54;
      color: #fff;
      padding: 5px 12px;
      border-radius: 0;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.1s ease;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #map-tooltip.visible { opacity: 1; }

    .panel-bottom-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-bottom-right .panel-body {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 18px 24px;
      gap: 20px;
      overflow: hidden;
    }

    #info-panel {
      display: flex;
      align-items: center;
      gap: 40px;
      width: 100%;
    }

    .flag-container {
      flex-shrink: 0;
      align-self: flex-start;
      width: 200px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #D4D4D0;
      background: #fff;
      overflow: hidden;
    }

    #borough-flag {
      max-width: 184px;
      max-height: 124px;
      display: block;
      object-fit: contain;
    }

    .info-text {
      flex: 1;
      min-width: 0;
    }

    #neighborhood-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      line-height: 1;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px 36px;
    }

    .metric {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .metric-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      line-height: 1.2;
      min-height: 2.4em;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 500;
      line-height: 1.2;
      min-height: 2.4em;
    }

    /* ========== BOROUGHS FILTER ========== */
    #boroughs-btn, #more-projects-btn {
      position: fixed;
      bottom: 6px;
      z-index: 50;
      padding: 8px 14px;
      background: #fff;
      color: #1A1A1A;
      border: 1px solid #1A1A1A;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.15s;
      text-decoration: none;
    }

    #boroughs-btn { left: 6px; }
    #more-projects-btn { right: 6px; }

    #boroughs-btn:hover, #more-projects-btn:hover { opacity: 0.85; }
    #boroughs-btn:active, #more-projects-btn:active { opacity: 0.6; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay[hidden] { display: none; }

    .modal-card {
      background: #F5F5F0;
      border: 1px solid #1A1A1A;
      min-width: 280px;
      max-width: 90vw;
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid #D4D4D0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #boroughs-close {
      background: none;
      border: none;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      color: #1A1A1A;
      line-height: 1;
      padding: 0 4px;
      font-family: inherit;
    }

    .modal-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-body label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
    }

    .modal-body input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #1A1A1A;
      margin: 0;
    }

    /* ========== MOBILE ========== */
    #details-toggle { display: none; }

    @media (max-width: 768px) {
      html, body { overflow: hidden; }

      .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: 40dvh 40dvh 20dvh;
        height: 100dvh;
      }

      .panel-header { padding: 0 14px; height: 38px; }

      #boroughs-btn { left: auto; right: 6px; }
      #more-projects-btn { display: none; }

      .panel-left {
        grid-row: auto;
        border-right: none;
        border-bottom: 1px solid #D4D4D0;
      }

      .panel-top-right { border-bottom: 1px solid #D4D4D0; }

      /* Panel is taken out of the grid flow on mobile in both states. Height is
         driven by the metrics's animated max-height — the panel auto-grows to
         exactly fit its content (min-height enforces the collapsed floor). No
         explicit panel-height transition needed. */
      .panel-bottom-right {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        min-height: 20dvh;
        height: auto;
        background: #F5F5F0;
        z-index: 10;
        border-top: 1px solid #D4D4D0;
      }

      .panel-bottom-right .panel-body {
        flex: 1 0 auto;
        padding: 12px 16px;
        gap: 0;
        align-items: flex-start;
      }

      #info-panel {
        gap: 12px;
        align-items: flex-start;
        width: 100%;
        height: auto;
      }

      .flag-container {
        width: 80px;
        height: 56px;
        flex-shrink: 0;
      }

      #borough-flag {
        max-width: 68px;
        max-height: 48px;
      }

      /* flex-wrap lets `.metrics` (with flex-basis 100%) flow onto a new line
         under the name+button row without flipping info-text to column — which
         would jump at click time. */
      .info-text {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      #neighborhood-name {
        font-size: 20px;
        margin-bottom: 0;
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .metrics {
        flex-basis: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 24px;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        margin-top: 0;
        transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                    opacity 0.25s ease,
                    margin-top 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .metrics.open {
        opacity: 1;
        margin-top: 12px;
        /* max-height is set inline by JS to scrollHeight so the transition
           timing matches the real content height. */
      }

      .metric-label { font-size: 10px; }
      .metric-value { font-size: 14px; }

      #details-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 1px solid #D4D4D0;
        background: #fff;
        font-size: 18px;
        font-weight: 700;
        color: #1A1A1A;
        cursor: pointer;
        flex-shrink: 0;
        line-height: 1;
        font-family: system-ui, -apple-system, sans-serif;
      }
    }
  </style>
