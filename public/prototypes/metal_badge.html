<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metal Badge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a1f;
    overflow: hidden;
  }

  /* ====== AMBIENT GLOW ====== */
  .ambient {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ====== BADGE CONTAINER ====== */
  .badge-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    /* Slight 3D perspective for depth even in static state */
    transform: perspective(800px) rotateX(5deg) rotateY(-3deg);
    transform-style: preserve-3d;
  }

  /* ====== OUTER RING ====== */
  .badge-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    /* Metallic gradient - key to metal look */
    background:
      conic-gradient(
        from 0deg,
        #b8860b 0deg,
        #ffd700 30deg,
        #b8860b 60deg,
        #8b6914 90deg,
        #daa520 120deg,
        #ffd700 150deg,
        #b8860b 180deg,
        #8b6914 210deg,
        #daa520 240deg,
        #ffd700 270deg,
        #b8860b 300deg,
        #8b6914 330deg,
        #b8860b 360deg
      );
    box-shadow:
      /* Outer glow */
      0 0 40px rgba(212,175,55,0.2),
      /* Drop shadow */
      0 12px 40px rgba(0,0,0,0.6),
      0 4px 12px rgba(0,0,0,0.4),
      /* Inner highlight ring */
      inset 0 2px 4px rgba(255,235,150,0.4),
      inset 0 -2px 4px rgba(0,0,0,0.3);
    z-index: 1;
  }

  /* Beveled edge highlight */
  .badge-outer::before {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border: 2px solid rgba(255,235,150,0.3);
    border-bottom-color: rgba(0,0,0,0.2);
    border-right-color: rgba(0,0,0,0.15);
  }

  /* ====== INNER RECESSED AREA ====== */
  .badge-inner {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background:
      radial-gradient(
        ellipse at 35% 30%,
        #daa520 0%,
        #b8860b 30%,
        #8b6914 60%,
        #6b4f0a 100%
      );
    box-shadow:
      /* Recessed feel - dark top, light bottom */
      inset 0 4px 12px rgba(0,0,0,0.5),
      inset 0 -3px 8px rgba(255,235,150,0.2),
      /* Subtle outer ridge */
      0 1px 2px rgba(255,235,150,0.3);
    z-index: 2;
  }

  /* Brushed metal texture overlay */
  .badge-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      repeating-linear-gradient(
        115deg,
        transparent 0px,
        transparent 1px,
        rgba(255,255,255,0.015) 1px,
        rgba(255,255,255,0.015) 2px
      );
    mix-blend-mode: overlay;
  }

  /* ====== STAR EMBLEM ====== */
  .star-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .star {
    width: 90px;
    height: 90px;
    position: relative;
  }

  .star svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .star svg path {
    fill: url(#star-metal);
    stroke: rgba(255,235,150,0.3);
    stroke-width: 0.5;
  }

  /* ====== DECORATIVE RING ====== */
  .deco-ring {
    position: absolute;
    inset: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,235,150,0.12);
    z-index: 2;
  }

  .deco-ring::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    border: 1px dashed rgba(255,235,150,0.08);
  }

  /* ====== TEXT ON BADGE ====== */
  .badge-text-top {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,235,150,0.5);
    z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .badge-text-bottom {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,235,150,0.35);
    z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    white-space: nowrap;
  }

  .badge-year {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    color: rgba(255,235,150,0.45);
    z-index: 4;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* ====== SPECULAR HIGHLIGHT ====== */
  .specular {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(
        ellipse at 32% 25%,
        rgba(255,255,240,0.18) 0%,
        transparent 50%
      );
    z-index: 5;
    pointer-events: none;
  }

  /* Secondary shine */
  .specular::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(
        ellipse at 70% 75%,
        rgba(255,235,150,0.06) 0%,
        transparent 40%
      );
  }

  /* ====== EDGE THICKNESS (3D depth illusion) ====== */
  .badge-edge {
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    background: linear-gradient(180deg, #6b4f0a 0%, #3a2a05 100%);
    transform: translateZ(-4px);
    z-index: 0;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }

  /* ====== DOTS AROUND BORDER ====== */
  .border-dots {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    z-index: 2;
  }

  .border-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #ffd700, #8b6914);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.3),
      0 1px 2px rgba(0,0,0,0.3);
  }

  /* ====== RIBBON ATTACHMENT ====== */
  .ribbon {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 50px;
    z-index: 0;
  }

  .ribbon-half {
    position: absolute;
    top: 0;
    width: 20px;
    height: 50px;
    background: linear-gradient(180deg, #8b1a1a 0%, #a02020 50%, #6b1010 100%);
    box-shadow:
      inset 2px 0 4px rgba(255,255,255,0.1),
      inset -1px 0 3px rgba(0,0,0,0.2),
      2px 4px 8px rgba(0,0,0,0.3);
  }

  .ribbon-half.left {
    left: 0;
    border-radius: 3px 0 0 0;
    transform: skewY(-3deg);
    transform-origin: top right;
  }

  .ribbon-half.right {
    right: 0;
    border-radius: 0 3px 0 0;
    transform: skewY(3deg);
    transform-origin: top left;
  }

  /* Ribbon fold/crease */
  .ribbon-half::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 12px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.2));
    border-radius: 0 0 2px 2px;
  }

  /* ====== LABEL ====== */
  .label {
    margin-top: 50px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    color: rgba(212,175,55,0.4);
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="ambient"></div>

<div class="badge-wrap">
  <!-- Ribbon -->
  <div class="ribbon">
    <div class="ribbon-half left"></div>
    <div class="ribbon-half right"></div>
  </div>

  <!-- Edge (depth) -->
  <div class="badge-edge"></div>

  <!-- Outer ring -->
  <div class="badge-outer"></div>

  <!-- Border dots -->
  <div class="border-dots" id="borderDots"></div>

  <!-- Inner area -->
  <div class="badge-inner"></div>

  <!-- Decorative ring -->
  <div class="deco-ring"></div>

  <!-- Text -->
  <div class="badge-text-top">EXCELLENCE</div>
  <div class="badge-year">2026</div>
  <div class="badge-text-bottom">EST · MMXXVI</div>

  <!-- Star -->
  <div class="star-wrap">
    <div class="star">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="star-metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd700"/>
            <stop offset="25%" stop-color="#b8860b"/>
            <stop offset="50%" stop-color="#ffe066"/>
            <stop offset="75%" stop-color="#b8860b"/>
            <stop offset="100%" stop-color="#daa520"/>
          </linearGradient>
        </defs>
        <path d="M50 8 L61 38 L93 38 L67 56 L76 88 L50 70 L24 88 L33 56 L7 38 L39 38 Z"/>
      </svg>
    </div>
  </div>

  <!-- Specular highlight -->
  <div class="specular"></div>
</div>

<div class="label">Metal Badge · Static</div>

<!-- Generate border dots with JS -->
<script>
  const dotsContainer = document.getElementById('borderDots');
  const dotCount = 36;
  const radius = 120;

  for (let i = 0; i < dotCount; i++) {
    const angle = (i / dotCount) * Math.PI * 2;
    const x = Math.cos(angle) * radius + radius - 2;
    const y = Math.sin(angle) * radius + radius - 2;
    const dot = document.createElement('div');
    dot.className = 'border-dot';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    dotsContainer.appendChild(dot);
  }
</script>

</body>
</html>
